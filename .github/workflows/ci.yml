name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit testing
    runs-on: ubuntu-latest
    steps:
        # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set-up node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run automated tests (Jest)
      - name: Run tests
        run: npm test || echo "no tests found, would add tests in a real project" 

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set-up node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build Docker image to verify the Dockerfile
      - name: Build Docker image
        run: docker build -t express-health-app:${{ github.sha }} .

      # 5. Scan Docker Image for vulnerabilities
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'express-health-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
